# B.Tech Attendance Tracker - Spring Boot Application Configuration
spring.application.name=btech-attendance-service
server.port=8080

# JPA & Database Settings
spring.datasource.url=jdbc:postgresql://localhost:5432/attendance_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis Caching (for sub-millisecond student summary retrieval)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=300000

# Swagger OpenAPI Documentation
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Academic Attendance Threshold (Minimum 75.0%)
academic.attendance.min-percentage=75.0
